  <text class="country" x="200" y="352">FRANCE</text>
  <text class="country" x="688" y="206" text-anchor="middle">GERMANY</text>
  <text class="country" x="652" y="578" text-anchor="middle">SWITZERLAND</text>
  <path class="shuttle" d="M79,74 L135,89"/>
  <path class="leg" d="M135,89 L307,294 L301,316 L310,410 L372,565 L593,500 L636,458 L569,426 L605,376 L679,277 L475,252 L441,102 L283,77 L135,89"/>
  <path class="arrow" d="M0,-4 L9,0 L0,4 Z" transform="translate(221,191) rotate(50)"/>
  <path class="arrow" d="M0,-4 L9,0 L0,4 Z" transform="translate(341,487) rotate(68)"/>
  <path class="arrow" d="M0,-4 L9,0 L0,4 Z" transform="translate(482,532) rotate(-16)"/>
  <path class="arrow" d="M0,-4 L9,0 L0,4 Z" transform="translate(642,326) rotate(-53)"/>
  <path class="arrow" d="M0,-4 L9,0 L0,4 Z" transform="translate(577,264) rotate(-173)"/>
  <path class="arrow" d="M0,-4 L9,0 L0,4 Z" transform="translate(458,177) rotate(-103)"/>
  <path class="arrow" d="M0,-4 L9,0 L0,4 Z" transform="translate(362,89) rotate(-171)"/>
  <path class="arrow" d="M0,-4 L9,0 L0,4 Z" transform="translate(209,83) rotate(-175)"/>
  <text class="drive" x="110" y="62" text-anchor="middle">Le Shuttle · 35 m</text>
  <text class="drive" x="234" y="186">2 h 40</text>
  <text class="drive" x="318" y="310">35 m</text>
  <text class="drive" x="316" y="368">1 h 10</text>
  <text class="drive" x="330" y="490" text-anchor="end">2 h 00</text>
  <text class="drive" x="482" y="551" text-anchor="middle">2 h 40</text>
  <text class="drive" x="630" y="487">1 h 10</text>
  <text class="drive" x="601" y="455" text-anchor="middle">1 h 40</text>
  <text class="drive" x="574" y="398" text-anchor="end">1 h 00</text>
  <text class="drive" x="654" y="332">1 h 45</text>
  <text class="drive" x="577" y="248" text-anchor="middle">2 h 45</text>
  <text class="drive" x="470" y="182">2 h 30</text>
  <text class="drive" x="362" y="107" text-anchor="middle">2 h 00</text>
  <text class="drive" x="209" y="66" text-anchor="middle">1 h 20</text>
  <circle class="way" cx="135" cy="89" r="4.5"/>
  <circle class="way" cx="301" cy="316" r="4.5"/>
  <circle class="way" cx="569" cy="426" r="4.5"/>
  <circle class="way" cx="283" cy="77" r="4.5"/>
  <circle class="way" cx="79" cy="74" r="4.5"/>

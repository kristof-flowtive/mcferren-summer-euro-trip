  <text class="sub" x="288" y="320" text-anchor="end">Hautvillers</text>
  <text class="sub" x="288" y="332" text-anchor="end">champagne stop</text>
  <circle class="night" cx="310" cy="410" r="8"/><text class="nightnum" x="310" y="413.5">1</text>
  <text class="city" x="296" y="414" text-anchor="end">Troyes</text>
  <circle class="night" cx="372" cy="565" r="8"/><text class="nightnum" x="372" y="568.5">1</text>

<svg viewBox="0 0 780 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" style="font-family:-apple-system,'Segoe UI',sans-serif">
  <title id="t">12-day Europe road trip route map</title>
  <desc id="d">Loop from Folkestone via Calais through Reims, Hautvillers, Troyes, Beaune to Basel, then Titisee, Riquewihr, Strasbourg, Heidelberg, Luxembourg, Maastricht, Ghent and back to Calais, with drive times per leg.</desc>
  <style>
    .city { font-size:13px; font-weight:600; fill:#2C2C2A; paint-order:stroke; stroke:#FFFFFF; stroke-width:3px; }
    .sub { font-size:10.5px; font-weight:400; fill:#5F5E5A; paint-order:stroke; stroke:#FFFFFF; stroke-width:3px; }
    .drive { font-size:11px; fill:#5F5E5A; paint-order:stroke; stroke:#FFFFFF; stroke-width:3px; }
    .country { font-size:11px; letter-spacing:2.5px; fill:#5F5E5A; opacity:0.5; }
    .leg { stroke:#378ADD; stroke-width:2.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .shuttle { stroke:#378ADD; stroke-width:2; fill:none; stroke-dasharray:4 5; stroke-linecap:round; }
    .arrow { fill:#378ADD; }
    .night { fill:#378ADD; }
    .nightnum { font-size:9px; font-weight:700; fill:#FFFFFF; text-anchor:middle; }
    .way { fill:#FFFFFF; stroke:#378ADD; stroke-width:2; }
  </style>
  <rect width="780" height="640" fill="#FFFFFF"/>
  <text class="country" x="42" y="40">ENGLAND</text>
  <text class="country" x="318" y="152" text-anchor="middle">BELGIUM</text>

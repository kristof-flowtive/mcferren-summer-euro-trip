  <circle class="night" cx="593" cy="500" r="8"/><text class="nightnum" x="593" y="503.5">3</text>
  <text class="city" x="593" y="524" text-anchor="middle">Basel</text>
  <circle class="night" cx="636" cy="458" r="8"/><text class="nightnum" x="636" y="461.5">1</text>
  <text class="city" x="650" y="462">Titisee</text>
  <text class="sub" x="556" y="424" text-anchor="end">Riquewihr</text>
  <text class="sub" x="556" y="436" text-anchor="end">lunch stop</text>
  <circle class="night" cx="605" cy="376" r="8"/><text class="nightnum" x="605" y="379.5">1</text>
  <text class="city" x="591" y="380" text-anchor="end">Strasbourg</text>
  <circle class="night" cx="679" cy="277" r="8"/><text class="nightnum" x="679" y="280.5">1</text>
  <text class="city" x="693" y="281">Heidelberg</text>
  <circle class="night" cx="475" cy="252" r="8"/><text class="nightnum" x="475" y="255.5">1</text>
  <text class="city" x="475" y="276" text-anchor="middle">Luxembourg</text>
  <circle class="night" cx="441" cy="102" r="8"/><text class="nightnum" x="441" y="105.5">1</text>
  <text class="city" x="455" y="99">Maastricht</text>
  <text class="sub" x="455" y="112">relatives</text>
  <text class="sub" x="283" y="56" text-anchor="middle">Ghent / Bruges · lunch</text>
  <g transform="translate(42,600)">
    <circle class="night" cx="6" cy="-4" r="8"/><text class="nightnum" x="6" y="-0.5">n</text>
    <text class="drive" x="20" y="0">overnight (n nights)</text>
    <circle class="way" cx="150" cy="-4" r="4.5"/>
    <text class="drive" x="162" y="0">stop en route</text>
    <line class="shuttle" x1="255" y1="-4" x2="285" y2="-4"/>
    <text class="drive" x="292" y="0">Channel Tunnel</text>
    <text class="drive" x="400" y="0">total driving ≈ 21–22 h over 12 days</text>
  </g>
</svg>

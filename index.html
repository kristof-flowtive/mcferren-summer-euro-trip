<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The McFerren's Summer Euro Trip</title>
  <meta name="description" content="A 12-day family road trip through France, Switzerland, Germany, Luxembourg, the Netherlands and Belgium — route map, things to do, and hotel bookings all in one place." />

  <!-- Leaflet map library (free, no API key) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Fonts: warm serif headings + friendly rounded sans body -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/styles.css?v=9" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-title">
        <span class="kicker">A McFerren family adventure · Summer 2026</span>
        <h1>The McFerren's <span class="amp">Summer</span> Euro Trip</h1>
        <p class="subtitle" id="subtitle"></p>
      </div>
      <div class="header-stats" id="header-stats"></div>
    </div>
  </header>

  <div class="trip-status" id="trip-status" hidden></div>

  <main class="layout">
    <!-- Map -->
    <section class="map-pane" aria-label="Route map">
      <div id="map"></div>
      <div class="map-legend">
        <span class="lk"><i class="dot overnight"></i> Overnight stop</span>
        <span class="lk"><i class="dot waypoint"></i> Stop en route</span>
        <span class="lk"><i class="line"></i> Drive</span>
        <span class="lk"><i class="line dashed"></i> Le Shuttle</span>
      </div>
    </section>

    <!-- Detail / list panel -->
    <aside class="detail-pane" id="detail-pane" aria-label="Stop details">
      <!-- Default: itinerary list -->
      <div id="list-view" class="view">
        <div class="list-header">
          <h2>The itinerary</h2>
          <p>Tap a stop on the map — or in the list below — to see what to do there and add your hotel.</p>
        </div>
        <ol class="stop-list" id="stop-list"></ol>
        <button class="info-toggle" id="practical-toggle" type="button">
          🚙 Practical notes for the drive
        </button>
        <div class="practical-box" id="practical-box" hidden></div>
      </div>

      <!-- Stop detail (populated on click) -->
      <div id="stop-view" class="view" hidden></div>
    </aside>
  </main>

  <div class="storage-banner" id="storage-banner"></div>

  <script src="assets/config.js?v=9"></script>
  <script src="assets/data.js?v=9"></script>
  <script src="assets/routes.js?v=9"></script>
  <script src="assets/app.js?v=9"></script>
</body>
</html>
